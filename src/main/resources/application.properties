spring.application.name=inventario

# Conexion con SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bd_almacen;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT (permite sobrescribir con variable de entorno JWT_SECRET)
app.jwt.secreto=${JWT_SECRET:claveSecretaIntranetAlmacenEMA2026DebeTenerMasDe32Caracteres}
app.jwt.expiracion-ms=28800000